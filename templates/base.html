<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="refresh" content="15">
<title>Jarvis Futures Bot Dashboard</title>
<style>
  :root {
    --bg: #0e1117;
    --panel: #161b22;
    --border: #2a2f3a;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #4f8cff;
    --green: #3fb950;
    --red: #f85149;
    --yellow: #d29922;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  }
  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 {
    font-size: 18px;
    margin: 0;
    font-weight: 600;
  }
  header .status {
    font-size: 13px;
    color: var(--muted);
  }
  nav {
    display: flex;
    gap: 4px;
    padding: 0 24px;
    border-bottom: 1px solid var(--border);
  }
  nav a {
    color: var(--muted);
    text-decoration: none;
    padding: 10px 16px;
    font-size: 14px;
    border-bottom: 2px solid transparent;
  }
  nav a.active {
    color: var(--text);
    border-bottom: 2px solid var(--accent);
  }
  main {
    padding: 24px;
    max-width: 1000px;
    margin: 0 auto;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
  }
  .card .label {
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 6px;
  }
  .card .value {
    font-size: 22px;
    font-weight: 600;
  }
  .value.positive { color: var(--green); }
  .value.negative { color: var(--red); }
  .value.halted { color: var(--red); }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  th, td {
    text-align: left;
    padding: 10px 14px;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
  }
  th {
    color: var(--muted);
    font-weight: 500;
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 0.04em;
  }
  tr:last-child td { border-bottom: none; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
  }
  .badge.long { background: rgba(63,185,80,0.15); color: var(--green); }
  .badge.short { background: rgba(248,81,73,0.15); color: var(--red); }
  .badge.flat { background: rgba(139,148,158,0.15); color: var(--muted); }
  .badge.bullish { background: rgba(63,185,80,0.15); color: var(--green); }
  .badge.bearish { background: rgba(248,81,73,0.15); color: var(--red); }
  .badge.neutral { background: rgba(139,148,158,0.15); color: var(--muted); }
  .empty {
    color: var(--muted);
    font-size: 14px;
    padding: 24px;
    text-align: center;
  }
  a.headline {
    color: var(--text);
    text-decoration: none;
  }
  a.headline:hover { color: var(--accent); }
  .news-meta {
    color: var(--muted);
    font-size: 12px;
    margin-top: 2px;
  }
  .news-item {
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
  }
  .news-item:last-child { border-bottom: none; }
</style>
</head>
<body>
<header>
  <h1>Jarvis Futures Bot</h1>
  <div class="status">Last updated: {{ state.last_updated or "never (strategy not running yet)" }}</div>
</header>
<nav>
  <a href="/" class="{{ 'active' if active_tab == 'overview' else '' }}">Overview</a>
  <a href="/positions" class="{{ 'active' if active_tab == 'positions' else '' }}">Positions</a>
  <a href="/log" class="{{ 'active' if active_tab == 'log' else '' }}">Trade Log</a>
  <a href="/news" class="{{ 'active' if active_tab == 'news' else '' }}">News</a>
</nav>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
